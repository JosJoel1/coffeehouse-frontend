<section id="servicios" class="seccion">
  <p class="sub">Lo que ofrecemos</p>
  <h2>Servicios</h2>
  <div class="grid">
    @for (s of lista(); track s.id) {
      <article class="tarjeta">
        @if (s.imagen) {
          <img [src]="s.imagen" [alt]="s.nombre" style="width:100%;margin-bottom:12px" />
        }
        <h3>{{ s.nombre }}</h3>
        <p>{{ s.descripcion }}</p>
      </article>
    }
  </div>
</section>
